[package]
name = "filament-client-desktop-security"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "filament_client_desktop_security"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "filament"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
filament-core = { path = "../../../crates/filament-core", version = "0.1.0" }
filament-e2ee = { path = "../../../crates/filament-e2ee", version = "0.1.0", features = ["sqlcipher-store"] }
filament-protocol = { path = "../../../crates/filament-protocol", version = "0.1.0" }
keyring = "4.1.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
thiserror = "2"
url = "2"
zeroize = "1"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "3"
