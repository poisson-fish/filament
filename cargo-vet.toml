# cargo-vet configuration for Filament E2EE dependencies.
#
# This file configures `cargo vet` (https://mozilla.github.io/cargo-vet/)
# for the OpenMLS dependency tree and other E2EE-related crates.
#
# `cargo vet` provides a structured review process for third-party crates.
# Each entry records who reviewed the crate, what version was reviewed,
# and whether the review was a full audit or a fast-track approval.
#
# Until the project completes formal reviews of the OpenMLS dependency tree,
# this file is only an inventory of intended "unaudited" entries with a
# documented justification, following
# the pattern established by the existing cargo-deny RUSTSEC-2024-0384
# advisory exception.
#
# This is not yet a generated cargo-vet store or an active CI gate. Do not
# represent it as a successful cargo-vet audit.

[[unaudited.openmls]]
version = "0.8.1"
note = "MIT licensed. RFC 9420 MLS implementation. Selected as the E2EE protocol stack per ADR 0001. Pending formal security review — tracked as Phase 7 exit criteria."

[[unaudited.openmls_traits]]
version = "0.5.0"
note = "MIT licensed. Trait definitions for OpenMLS provider abstraction. Reviewed as part of OpenMLS integration."

[[unaudited.openmls_rust_crypto]]
version = "0.5.1"
note = "MIT licensed. Default crypto provider using RustCrypto crates. No C dependencies. Reviewed as part of OpenMLS integration."

[[unaudited.openmls_basic_credential]]
version = "0.5.0"
note = "MIT licensed. BasicCredential + SignatureKeyPair implementation for testing and simple credential types."

[[unaudited.openmls_memory_storage]]
version = "0.5.0"
note = "MIT licensed. In-memory storage provider for OpenMLS. Used in spikes and tests only."

[[unaudited.tls_codec]]
version = "0.4.2"
note = "MIT/Apache-2.0 dual licensed. TLS serialization/deserialization codec used by OpenMLS for wire format."

[[unaudited.zeroize]]
version = "1.8.1"
note = "Apache-2.0/MIT licensed. Memory zeroization for sensitive key material. Industry-standard, widely audited."

[[unaudited.serde_bytes]]
version = "0.11.17"
note = "MIT/Apache-2.0 licensed. Serde wrapper for byte arrays, used by OpenMLS for binary field serialization."

[[unaudited.rusqlite]]
version = "0.39.0"
note = "MIT licensed. Safe Rust bindings used with the bundled SQLCipher feature for the device-local encrypted store. Pinned to the newest release compatible with the repository Rust 1.93 toolchain."

[[unaudited.libsqlite3-sys]]
version = "0.37.0"
note = "MIT licensed bindings that vendor SQLCipher for deterministic desktop builds. SQLCipher itself uses a permissive BSD-style license."

[[unaudited.keyring]]
version = "4.1.5"
note = "MIT/Apache-2.0 licensed cross-platform facade for Keychain, Windows Credential Manager, and Secret Service."

[[unaudited.keyring-core]]
version = "1.0.0"
note = "MIT/Apache-2.0 licensed typed credential-store core used by keyring and its native platform adapters."

[[unaudited.apple-native-keyring-store]]
version = "1.0.1"
note = "MIT/Apache-2.0 licensed macOS Keychain adapter selected by keyring on Apple targets."

[[unaudited.windows-native-keyring-store]]
version = "1.1.0"
note = "MIT/Apache-2.0 licensed Windows Credential Manager adapter selected by keyring on Windows targets."

[[unaudited.zbus-secret-service-keyring-store]]
version = "1.0.0"
note = "MIT/Apache-2.0 licensed Secret Service adapter selected by keyring on Linux targets."

[[unaudited.openssl-sys]]
version = "0.9.117"
note = "MIT licensed OpenSSL bindings used only as the vendored SQLCipher crypto-provider integration layer."

[[unaudited.openssl-src]]
version = "300.6.1+3.6.3"
note = "MIT/Apache-2.0 licensed source package for the OpenSSL 3 build linked by bundled SQLCipher."
