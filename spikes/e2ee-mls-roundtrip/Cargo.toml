[package]
name = "e2ee-mls-roundtrip"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# This crate is a standalone engineering spike and is NOT part of the
# filament workspace. Build and test it separately:
#   cd spikes/e2ee-mls-roundtrip && cargo test

[dependencies]
