[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # Build-time-only transitive dependency of libcrux/hax. This is an
  # unmaintained notice, not a vulnerability; no replacement is currently
  # available in the fixed hpke-rs 0.7 provider chain.
  "RUSTSEC-2026-0173",
]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  # Transitive from proc-macro2/unicode-ident.
  "Unicode-3.0",
  # Transitive from hashbrown/foldhash.
  "Zlib",
]
confidence-threshold = 0.9
exceptions = [
  # Approved weak-copyleft dependencies used by OpenMLS. Distribution must
  # include THIRD_PARTY_NOTICES.txt and make these exact sources available.
  { allow = ["MPL-2.0"], crate = "hpke-rs:0.7.0" },
  { allow = ["MPL-2.0"], crate = "hpke-rs-crypto:0.7.0" },
  { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto:0.7.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/openmls/openmls"]
